name: QuickFeedback CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # JOB 1: Backend CI (Lint & Automated Test)
  # -------------------------------------------------------------
  test-backend:
    name: Test Backend API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend tests
        working-directory: ./backend
        env:
          NODE_ENV: test
        run: npm test

  # -------------------------------------------------------------
  # JOB 2: Frontend CI (Build Validation)
  # -------------------------------------------------------------
  test-frontend:
    name: Build & Verify Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend static bundle
        working-directory: ./frontend
        env:
          VITE_API_URL: "http://${{ secrets.EC2_HOST }}:5000"
        run: npm run build

  # -------------------------------------------------------------
  # JOB 3: Deploy Backend to Amazon EC2
  # -------------------------------------------------------------
  deploy-backend:
    name: Deploy Backend to EC2
    needs: [ test-backend ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH onto EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/quickfeedback
            git pull origin main
            cd backend
            npm ci --omit=dev
            echo "PORT=5000" > .env
            echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
            echo "NODE_ENV=production" >> .env
            pm2 restart quickfeedback-api || pm2 start src/index.js --name "quickfeedback-api"
            pm2 save

  # -------------------------------------------------------------
  # JOB 4: Deploy Frontend to Amazon S3
  # -------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend to S3
    needs: [ test-frontend, deploy-backend ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build
        working-directory: ./frontend
        env:
          VITE_API_URL: "http://${{ secrets.EC2_HOST }}:5000"
        run: |
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync static files to Amazon S3
        run: |
          aws s3 sync ./frontend/dist s3://${{ secrets.S3_BUCKET_NAME }} --delete

